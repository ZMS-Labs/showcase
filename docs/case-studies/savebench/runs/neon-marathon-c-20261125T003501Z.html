(function(root,factory){

  const KEY=[['✓','worked (a reply: every move in it worked)'],['!','some moves in the reply worked, some did not'],['✕','did not work'],
    ['⊘','refused by this test’s rules'],['○','the reply held no move']];
  const MOVE_TONE={done:'good',refused:'refused',failed:'stop'};
  const TONE_WORDS={good:'every move worked',wait:'some moves worked',stop:'no move worked',refused:'every move was refused by this test',quiet:'no move'};
  const STEP_WORDS={good:'Worked',stop:'Did not work',refused:'Refused by this test',quiet:'No result'};
  const BY={game:'Game said',test:'This test’s rule',hint:'The run’s hint',record:'The run’s record'};

  function clampIndex(i,n){return n<=0?0:Math.max(0,Math.min(n-1,Math.trunc(Number(i)||0)));}
  function plural(n,one,many){return n+' '+(n===1?one:many);}

  function turnTone(t){
    if(!t.steps.length)return 'quiet';
    if(t.steps.every(s=>s.outcome==='done'))return 'good';
    if(t.steps.every(s=>s.outcome==='refused'))return 'refused';
    if(t.steps.some(s=>s.outcome==='done'))return 'wait';
    return 'stop';

  function wentWrong(t){return !t.steps.length||t.steps.some(s=>s.outcome!=='done');}

  function codeIndex(story){

    return m;

    if(Array.isArray(x.said)&&x.said.length)out.said=x.said.map(labelled);

  function heroView(story,ti){
    const g=story.goal;

    const end=ti>=n-1;

    const shortWords=short.map(i=>i.missing+' '+i.name);
    let headline;
    if(!end)headline=short.length?'After reply '+(ti+1)+' of '+n+', machines still had to make '+and(shortWords)+'.'
      :'After reply '+(ti+1)+' of '+n+', the record counts enough machine-made items for every cost.';
    else if(earned){
      if(short.length)headline='Milestone '+ms+' is bought, but the record counts too few machine-made '+and(short.map(i=>i.name))+'.';
      else if(atLeast.length)headline='Milestone '+ms+' is bought, but at least '+and(atLeast.map(a=>a.count+' of the '+a.of+' '+a.name))
        +' it paid in '+(atLeast.length===1&&atLeast[0].count===1?'was':'were')+' made by hand.';
      else if(open.length||fed.length)headline='Milestone '+ms+' is bought, and the record counts enough machine-made items for every cost. Help by hand leaves open questions (below).';
      else headline='Yes: milestone '+ms+' is bought, and the record counts enough machine-made items for every cost.';
    }else headline=short.length?'Not this time. Its machines still had to make '+and(shortWords)+'.'
      :'Its machines made enough of every item, but the milestone was not bought.';
    // Whole-run notes: these do not move with the replies.
    const notes=[];
    const ores=(Array.isArray(g.ore)?g.ore:[]).map(o=>{
      const bits=[];
      if(o.machine)bits.push(o.machine+' dug by Miners');
      if(o.portable)bits.push(o.portable+' dug by a Portable Miner (not counted as machine-made)');
      if(o.uncounted)bits.push(o.uncounted+' collected but not counted as machine-made');
      if(o.hand)bits.push(o.hand+' dug by hand');
      return o.name+': '+(bits.join(', ')||'none');
    });
    if(ores.length)notes.push({kind:'ore',text:'Ore is counted apart from the goal’s items. '+ores.join('. ')+'.'});
    if(fed.length)notes.push({kind:'fed',text:'Ore carried into machines by hand: '+and(fed.map(f=>f.count+' '+f.name))
      +'.'+(boot.length?' Collects the record marks “bootstrap” are not counted as machine-made: '
      +and(boot.map(b=>b.count+' '+b.name))+'.':'')+' Whether such output should ever count is open.'});
    for(const r of Array.isArray(p.refused)?p.refused:[]){
      const sh=Array.isArray(r.short)&&r.short.length?and(r.short.map(s=>s.count+' '+s.name)):null;

    for(const a of atLeast)notes.push({kind:'hand-paid',text:'After that refusal it made '+a.bench_after+' '+a.name+' by hand at the bench and collected '
      +(a.collected_after?a.collected_after+' more':'none')+' from its machines, then paid. So at least '+a.count+' of the '+a.of+' '+a.name
      +' it paid in were made by hand; the record does not give the exact number. The record still marks the run earned: this test’s rule counts machine-made '
      +a.name+(made(a.name)!=null?' ('+made(a.name)+' made, '+a.of+' needed)':'')+' toward the goal.'});
    if(open.length){
      const bb=(Array.isArray(p.bench_before_pay)?p.bench_before_pay:[]).filter(b=>open.some(o=>o.key===b.key));
      const words=bb.map(b=>(b.earned+b.not_earned)+' '+b.name+(b.earned&&b.not_earned?' ('+b.earned+' counted as earned bench items, '+b.not_earned+' not earned)':''));

  }

  function view(story,{turn=0,onlyWrong=false}={}){
    if(!story||story.schema!==SCHEMA)return {ok:false,message:'This is not an AI run story file.'};
    const turns=Array.isArray(story.turns)?story.turns.filter(t=>t&&Array.isArray(t.steps)):[];
    if(!turns.length)return {ok:false,message:'This run has no recorded replies to show.'};
    const ti=clampIndex(turn,turns.length);
    const t=turns[ti];
    const s=story.summary||{};
    const f=story.film;
    const codes=codeIndex(story);
    const film=f&&typeof f.src==='string'&&f.src&&typeof f.caption==='string'&&f.caption?{src:f.src,caption:f.caption,
      poster:typeof f.poster==='string'&&f.poster.startsWith('data:image/')?f.poster:null}:null;
    const model=typeof story.model_name==='string'&&story.model_name?story.model_name
      :typeof story.model==='string'&&story.model?story.model:null;
    const list=a=>a.map(c=>c.name+' '+c.count).join(', ');
    const has=a=>Array.isArray(a)&&a.length>0;
    const earned=story.earned===true&&story.verdict==='pass';
    const g=story.goal&&typeof story.goal==='object'?story.goal:null;
    const ores=g&&Array.isArray(g.ore)?g.ore:[];
    const fedWords=Array.isArray(s.hand_fed)?(s.hand_fed.length?'. Ore carried into machines by hand: '+list(s.hand_fed):'. No machine was fed by hand'):'';
    // A Marathon: the milestones the game accepted, in order, each at the reply that paid for it.
    const marathon=story.marathon&&Array.isArray(story.marathon.bought)?{bought:story.marathon.bought
      .filter(b=>b&&typeof b.index==='number'&&b.index>=0&&b.index<turns.length)
      .map(b=>({milestone:b.milestone,index:b.index,where:'Reply '+(b.index+1),reached:b.index<=ti,current:b.index===ti,
        cost:(Array.isArray(b.cost)?b.cost:[]).map(c=>c.count+' '+c.name).join(', '),fully:b.fully_earned===true})),
      replies:turns.length}:null;
    const tiles=[
      typeof s.replies==='number'?{big:String(s.replies),small:'replies from the AI'+(s.lost_replies?', '+s.lost_replies+' with no move':'')}:null,
      typeof s.actions==='number'?{big:String(s.actions),small:'moves: '+(s.done||0)+' worked, '+(s.refused||0)+' refused by this test, '+(s.failed||0)+' did not work'}:null,
      s.not_run?{big:String(s.not_run),small:'moves skipped because an earlier move in the same reply failed'}:null,
      typeof s.miners==='number'?{big:String(s.miners),small:plural(s.miners,'Miner','Miners').replace(/^\d+ /,'')+' standing, '+plural(s.belts||0,'belt','belts')}:null,
      g&&has(g.parts_made)?{big:String(g.parts_made.reduce((a,c)=>a+(c.count||0),0)),
        small:'items made by its machines (ore not included): '+list(g.parts_made)+fedWords
          +(has(s.hand_crafted)?'. Made at the bench by hand (not counted toward the goal): '+list(s.hand_crafted):'')}
      :!g&&has(s.machine_made)?{big:String(s.machine_made.reduce((a,c)=>a+(c.count||0),0)),
        small:'items made by its machines: '+list(s.machine_made)+fedWords
          +(has(s.hand_mined)?'. Mined by hand: '+list(s.hand_mined):'')
          +(has(s.hand_crafted)?'. Made at the bench by hand: '+list(s.hand_crafted):'')}
        :!g&&has(s.collected)?{big:String(s.collected.reduce((a,c)=>a+(c.count||0),0)),
        small:'items collected: '+list(s.collected)}:null,
      ores.length?{big:String(ores.reduce((a,o)=>a+(o.machine||0)+(o.portable||0)+(o.uncounted||0)+(o.hand||0),0)),
        small:'ore dug, counted apart from the goal’s items: '+ores.map(o=>o.name+' '+((o.machine||0)+(o.portable||0)+(o.uncounted||0)+(o.hand||0))).join(', ')}:null,
    ].filter(Boolean);
    const chapters=(Array.isArray(story.chapters)?story.chapters:[])
      .filter(c=>c&&typeof c.index==='number'&&c.index>=0&&c.index<turns.length)
      .map(c=>({index:c.index,kind:c.kind,label:c.label,said:c.said||null,current:c.index===ti,
        where:'Reply '+(c.index+1)}));
    const moveWords=y=>y.text+(y.outcome==='done'?'':y.outcome==='refused'?' ('+MARK.refused+' refused by this test)':' ('+MARK.stop+' did not work)');
    const log=turns.map((x,i)=>{const tone=turnTone(x);return {index:i,current:i===ti,tone,mark:MARK[tone],wrong:wentWrong(x),
      text:'Reply '+(i+1)+': '+(x.steps.length?x.steps.map(moveWords).join('; '):(x.lost||'no move'))};});
    const wrongCount=log.filter(r=>r.wrong).length;
    const tone=turnTone(t);
    return {ok:true,
      title:typeof story.title==='string'&&story.title?story.title:'An AI plays'+(story.milestone?': milestone '+story.milestone:''),
      madeBy:model?'Played by an AI: '+model:'Played by an AI',
      verdict:marathon?(marathon.bought.length?{tick:true,text:'The game checked: '+marathon.bought.length+(marathon.bought.length===1?' milestone':' milestones')+' bought'}
        :{tick:false,text:story.stop_words||'No milestone bought'})
        :earned?{tick:true,text:'The game checked: milestone bought'}
        :{tick:false,text:(story.verdict==='fail'?'Not earned. ':'')+(story.stop_words||'How the run ended is not recorded')},
      note:'Every move below was chosen by the AI and comes from the run’s record. Refusals are quoted as recorded.'
        +(film?' The film was made afterwards from the run’s save.':''),
      film,tiles,hero:heroView(story,ti),marathon,key:KEY.map(([mark,words])=>({mark,words})),
      chapters:{main:chapters.filter(c=>c.kind!=='wrong'),wrong:chapters.filter(c=>c.kind==='wrong')},
      codes:(Array.isArray(story.codes)?story.codes:[]).map(c=>{const by=byOf(c.by);
        return {code:c.code,kind:c.kind,by,label:BY[by],origin:c.origin||null,count:c.count,why:c.why||null,
          source:c.source||null,hint:c.hint||null};}),
      strip:turns.map((x,i)=>{const tn=turnTone(x);
        return {index:i,turn:x.turn,tone:tn,current:i===ti,mark:MARK[tn],label:'Reply '+(i+1)+': '+TONE_WORDS[tn]};}),
      moment:{index:ti,count:turns.length,text:'Reply '+(ti+1)+' of '+turns.length},
      live:'Reply '+(ti+1)+' of '+turns.length+': '+TONE_WORDS[tone]+'.',
      card:{turn:t.turn,note:t.note||null,lost:t.lost||null,
        steps:t.steps.map(x=>stepView(x,codes)),
        notRun:t.not_run?plural(t.not_run,'later move','later moves')+' in this reply '+(t.not_run===1?'was':'were')+' not run, because this one failed.':null},
      log:onlyWrong?log.filter(r=>r.wrong):log,
      logCount:onlyWrong?'Showing '+plural(wrongCount,'reply','replies')+' where something went wrong, of '+log.length+'.'
        :'Showing all '+plural(log.length,'reply','replies')+'.',
      source:story.sources&&story.sources.transcript_sha256?'Record '+String(story.sources.transcript_sha256).slice(0,12)
        +(story.sources.unreadable_rows?' · '+plural(story.sources.unreadable_rows,'unreadable row','unreadable rows')+' left out':''):''};
  }

  // ---- browser ----

  // The factory as it stood after reply ti (0-based): replay the record's own build, belt, recipe and
  // take-down moves up to that reply. Pure, so it can be tested without a browser.
  const FCOLS=[['ore','Ore spots'],['miner','Miners'],['smelter','Smelters'],['machine','Constructors'],['storage','Storage']];
  function factoryAt(f,ti){
    const items=new Map(),belts=[],power={burner:0,pole:0};
    let added=0,removed=0;
    if(!f||!Array.isArray(f.events))return null;
    for(const e of f.events){
      if(e.at>ti)continue;
      const now=e.at===ti;
      if(e.op==='add'){
        if(e.col==='power'){const k=/^pole/.test(e.id)?'pole':'burner';power[k]+=1;items.set(e.id,{id:e.id,col:'power',kind:k});if(now)added+=1;continue;}
        items.set(e.id,{id:e.id,col:e.col,label:e.label,recipe:null,node:e.node||null,fresh:now});
        if(e.node&&!items.has(e.node))items.set(e.node,{id:e.node,col:'ore',label:(e.ore||'Ore')+' spot',fresh:now});
        if(now)added+=1;
      }else if(e.op==='recipe'&&items.has(e.id)){items.get(e.id).recipe=e.recipe;}
      else if(e.op==='belt'){belts.push({from:e.from,to:e.to,fresh:now});}
      else if(e.op==='remove'&&items.has(e.id)){
        const it=items.get(e.id);if(it.col==='power')power[it.kind]-=1;
        items.delete(e.id);if(now)removed+=1;
      }
    }
    const live=belts.filter(b=>items.has(b.from)&&items.has(b.to));
    const cols=FCOLS.map(([k,title])=>({key:k,title,items:[...items.values()].filter(it=>it.col===k)}));
    // an ore spot stays only while a miner stands on it
    const used=new Set([...items.values()].map(it=>it.node).filter(Boolean));
    cols[0].items=cols[0].items.filter(it=>used.has(it.id));
    const machines=cols.slice(1).reduce((n,c)=>n+c.items.length,0);
    return {cols,belts:live,power,machines,added,removed};
  }
  function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!=null)n.textContent=text;return n;}
  function btn(cls,text,fk){const b=el('button',cls,text);b.type='button';if(fk)b.dataset.fk=fk;return b;}
  function sel(fk){return '[data-fk="'+(typeof CSS!=='undefined'&&CSS.escape?CSS.escape(fk):fk)+'"]';}

  // Draws the page once and updates it in place, so open toggles, focus, the film and the one
  // live region survive every change. Parts that do change (the reply card, the reply list) are
  // rebuilt with a stable key on every focusable element and every toggle.
  function mount(root,story){
    const v0=view(story,{turn:0});
    root.replaceChildren();
    if(!v0.ok){root.append(el('p','lst-msg',v0.message));return {redraw(){},state:{}};}
    const last=v0.moment.count-1;
    const st={turn:last,timer:null,onlyWrong:false,open:{},focus:null};   // opens on the run's final state
    let v=view(story,st);
    if(typeof document!=='undefined'&&v.title)document.title=v.title;

    function toggle(key,cls,summary){
      const d=el('details',cls);d.dataset.key=key;d.open=!!st.open[key];
      d.addEventListener('toggle',()=>{st.open[key]=d.open;});
      const s=el('summary',null,summary);s.dataset.fk='sum:'+key;d.append(s);return d;
    }
    function stop(){if(st.timer){clearInterval(st.timer);st.timer=null;}}
    function go(i,fk){stop();st.turn=i;if(fk)st.focus=fk;draw();}
    function play(from){
      stop();
      if(from!=null)st.turn=from;else if(st.turn>=last)st.turn=0;
      st.timer=setInterval(()=>{if(st.turn>=last)stop();else st.turn+=1;draw();},1400);
      draw();
    }

    const head=el('header','lst-head');
    head.append(el('h1',null,v.title));
    const tags=el('p','lst-tags');
    tags.append(el('span','lst-tag lst-tag-ai',v.madeBy));
    tags.append(el('span','lst-tag '+(v.verdict.tick?'lst-tag-ok':'lst-tag-plain'),(v.verdict.tick?'✓ ':'')+v.verdict.text));
    head.append(tags,el('p','lst-note',v.note));
    root.append(head);

    if(v.tiles.length){
      const sum=el('section','sst-tiles');sum.setAttribute('aria-labelledby','sst-tiles-h');
      const h=el('h2',null,'The run in numbers');h.id='sst-tiles-h';
      const grid=el('div','sst-tile-grid');
      v.tiles.forEach((t,i)=>{const d=el('div','sst-tile');
        // Visual first: the big number and a few words; the full breakdown sits behind its own toggle.
        const cut=t.small.indexOf(':'),short=cut>0?t.small.slice(0,cut):t.small;
        d.append(el('span','sst-big',t.big),el('span','sst-small',short));
        if(cut>0){const m=toggle('tile'+i,'sst-tile-more','In full');m.append(el('p',null,t.small.slice(cut+1).trim()));d.append(m);}
        grid.append(d);});
      sum.append(h,grid);root.append(sum);
    }

    let mara=null;
    if(v.marathon){
      const ms=el('section','sst-mara');ms.setAttribute('aria-labelledby','sst-mara-h');
      const mh=el('h2',null,v.marathon.bought.length?'Milestones the game accepted':'No milestone bought');mh.id='sst-mara-h';
      // One line from the first reply to the last, a dot where each milestone was paid for.
      const track=el('div','sst-mara-track');track.setAttribute('role','img');
      track.setAttribute('aria-label',v.marathon.bought.map(b=>b.milestone+' at reply '+(b.index+1)).join(', ')+(v.marathon.bought.length?'; ':'')+v.marathon.replies+' replies in all');
      const run=el('span','sst-mara-run');track.append(run);
      const den=Math.max(1,v.marathon.replies-1);
      const pins=v.marathon.bought.map((b,i)=>{const pin=el('span','sst-mara-pin'+(i%2?' is-low':''));pin.style.left=(b.index/den*100)+'%';pin.append(el('em',null,b.milestone));track.append(pin);return pin;});
      const cards=el('div','sst-mara-cards');
      const btns=v.marathon.bought.map(b=>{const c=btn('sst-mara-card','', 'mara'+b.index);
        c.append(el('span','sst-mara-ms',b.milestone),el('span','sst-mara-at',b.where),el('span','sst-mara-cost',b.cost));
        c.addEventListener('click',()=>{go(b.index,'mara'+b.index);});cards.append(c);return c;});
      ms.append(mh,track,cards);root.append(ms);
      mara={pins,btns};
    }

    let hero=null;
    if(v.hero){
      const h=el('section','sst-hero');h.setAttribute('aria-labelledby','sst-hero-h');
      const hh=el('h2');hh.id='sst-hero-h';
      const ctl=el('p','sst-hero-ctl');
      const watch=btn('lst-skip sst-watch','Watch it from the start','watch');
      watch.addEventListener('click',()=>{play(0);});
      ctl.append(watch);
      const atP=el('p','lst-note');
      const legend=el('p','sst-legend');
      for(const [cls,words] of [['sst-sw-machine','made by machines: counts toward the goal'],['sst-sw-missing','still missing'],
        ['sst-sw-bench','made by hand at the bench: does not count toward the goal']]){
        const k=el('span','sst-key');k.append(el('span','sst-sw '+cls),el('span',null,words));legend.append(k);
      }
      const ul=el('ul','sst-goals');
      const rows=v.hero.items.map(()=>{
        const li=el('li','sst-goal');
        const name=el('strong'),num=el('span','sst-goal-n');
        const top=el('p','sst-goal-top');top.append(name,num);
        const bar=el('div','sst-bar');bar.setAttribute('role','img');
        const m=el('span','sst-seg sst-seg-machine');bar.append(m);
        const text=el('p','sst-goal-text');
        const bench=el('div','sst-bench');bench.setAttribute('role','img');
        const bs=el('span','sst-seg sst-seg-bench');bench.append(bs);
        const btext=el('p','sst-goal-text sst-bench-text');
        li.append(top,bar,text,bench,btext);ul.append(li);
        return {li,name,num,bar,m,text,bench,bs,btext};
      });
      h.append(hh,ctl,el('p','lst-note',v.hero.goalText),atP,legend,ul);
      const d=toggle('checks','sst-more','How these numbers are checked');
      d.append(el('p','lst-note',v.hero.counted));
      if(v.hero.notes.length){
        const w=el('div','sst-whole');
        w.append(el('h3',null,'For the whole run (these do not change with the replies)'));
        const nl=el('ul');for(const n of v.hero.notes){const li=el('li',null,n.text);li.dataset.kind=n.kind;nl.append(li);}
        w.append(nl);d.append(w);
      }
      d.append(el('p',null,'The bars add up the run’s own collect and craft moves, reply by reply. Before this page was made, the totals were checked against the run’s record and matched exactly: '
        +v.hero.checks.join(', ')+'. If they had not matched, no page would have been made. The record has no clock times, so the bars move by reply, not by minute.'));
      h.append(d);
      root.append(h);
      hero={hh,atP,rows};
    }

    if(v.film){
      const fs=el('section','lst-film');
      fs.append(el('h2',null,'What it built, filmed afterwards'));
      const vid=el('video','lst-video');vid.controls=true;vid.preload='none';vid.playsInline=true;
      if(v.film.poster)vid.poster=v.film.poster;
      vid.src=v.film.src;
      const missing=el('p','lst-gap','The film file is not next to this page, so only its first still is shown.');missing.hidden=true;
      vid.addEventListener('error',()=>{missing.hidden=false;});
      fs.append(vid,el('p','lst-note',v.film.caption),missing);
      root.append(fs);
    }

    const bar=el('section','lst-time');bar.setAttribute('aria-label','Play the run');
    const playB=btn('lst-play','Play','play');
    playB.addEventListener('click',()=>{if(st.timer){stop();draw();}else play();});
    const range=el('input','lst-range');range.type='range';range.min='0';range.max=String(last);
    range.setAttribute('aria-label','Reply');range.dataset.fk='range';
    range.addEventListener('input',()=>{go(Number(range.value));});
    const endB=btn('lst-skip','Skip to the end','end');
    endB.addEventListener('click',()=>{go(last);});
    const strip=el('div','sst-strip');strip.setAttribute('role','group');strip.setAttribute('aria-label','Replies in order');
    const dots=v.strip.map(d=>{
      const dot=btn('sst-dot',d.mark,'dot'+d.index);
      dot.setAttribute('aria-label',d.label);dot.title=d.label;
      dot.addEventListener('click',()=>{go(d.index,'dot'+d.index);});
      dot.addEventListener('keydown',e=>{
        let to=null;
        if(e.key==='ArrowRight'||e.key==='ArrowDown')to=Math.min(last,d.index+1);
        else if(e.key==='ArrowLeft'||e.key==='ArrowUp')to=Math.max(0,d.index-1);
        else if(e.key==='Home')to=0;else if(e.key==='End')to=last;
        if(to!=null){e.preventDefault();go(to,'dot'+to);}
      });
      strip.append(dot);return dot;
    });
    const moment=el('p','lst-moment');
    const key=el('p','sst-symkey');
    key.append(el('span','sst-symkey-h','Symbols: '));
    v.key.forEach((k,i)=>{const s=el('span','sst-symkey-i');s.append(el('b',null,k.mark),document.createTextNode(' '+k.words+(i<v.key.length-1?' · ':'.')));key.append(s);});
    key.append(el('span','sst-symkey-i',' The reply shown has an orange ring; keyboard focus is a dashed outline.'));
    const live=el('p','sst-live');live.setAttribute('role','status');live.setAttribute('aria-live','polite');
    const keyBox=toggle('symbols','sst-more sst-keybox','What the squares mean');
    keyBox.append(key,el('p','sst-axis','Squares go by reply, not by clock: the record has no timestamps, so any time on this strip would be estimated. Use the arrow keys to step through.'));
    bar.append(playB,range,endB,strip,moment,keyBox,live);
    root.append(bar);

    // The factory drawing: follows the replay controls above it.
    let fac=null;
    if(story.factory&&story.factory.events&&story.factory.events.length){
      const fs=el('section','sst-fac');fs.setAttribute('aria-labelledby','sst-fac-h');
      const fh=el('h2',null,'The factory it built');fh.id='sst-fac-h';
      const fsum=el('p','sst-fac-sum');
      const fbox=el('div','sst-fac-box');
      const facMore=toggle('facnote','sst-more','How to read this drawing');
      fs.append(fh,fsum,el('p','sst-fac-swipe','Swipe sideways to see the whole factory.'),fbox,facMore);
      facMore.append(el('p','sst-fac-note','Every building the AI placed and every belt it laid (arrows point the way the belt carries), from the run’s record, as they stood after the reply shown. '
        +'Columns group machines by job, not by where they stood in the world. New this reply: orange outline. Burners and power poles are counted, not drawn.'));
      root.append(fs);
      fac={fsum,fbox};
    }
    function drawFactory(ti){
      if(!fac)return;
      const s=factoryAt(story.factory,ti);if(!s)return;
      const NS='http://www.w3.org/2000/svg';
      const sv=(t,a,x)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);if(x!=null)n.textContent=x;return n;};
      const rows=Math.max(1,...s.cols.map(c=>c.items.length));
      const W=820,CW=W/5,BW=140,BH=44,GAP=14,TOP=30,H=TOP+rows*(BH+GAP);
      const svg=sv('svg',{viewBox:'0 0 '+W+' '+H,role:'img','class':'sst-fac-svg'});
      const defs=sv('defs',{});
      [['sst-fac-ah',''],['sst-fac-ahn',' is-new']].forEach(([id,c])=>{
        const m=sv('marker',{id,viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'});
        m.append(sv('path',{d:'M0,0 L10,5 L0,10 z','class':'sst-fac-head'+c}));defs.append(m);});
      svg.append(defs);
      const pos={};
      s.cols.forEach((c,i)=>{
        svg.append(sv('text',{x:i*CW+CW/2,y:16,'text-anchor':'middle','class':'sst-fac-col'},c.title));
        c.items.forEach((it,j)=>{pos[it.id]={x:i*CW+(CW-BW)/2,y:TOP+j*(BH+GAP)};});
      });
      const lines=sv('g',{});
      const link=(a,b,cls)=>{const p=pos[a],q=pos[b];if(!p||!q)return;
        let x1=p.x+BW,y1=p.y+BH/2,x2=q.x,y2=q.y+BH/2;
        // Same column (say Wire into Cable): loop out of the right edge and back in, so the belt and its arrow
        // stay outside both boxes whichever is higher. A belt to a column on the left leaves by the left edge.
        if(q.x===p.x){x2=q.x+BW;const bx=x1+22;
          lines.append(sv('path',{d:'M'+x1+','+y1+' C'+bx+','+y1+' '+bx+','+y2+' '+x2+','+y2,'class':cls}));return;}
        if(q.x<p.x){x1=p.x;x2=q.x+BW;}
        const mx=(x1+x2)/2;
        lines.append(sv('path',{d:'M'+x1+','+y1+' C'+mx+','+y1+' '+mx+','+y2+' '+x2+','+y2,'class':cls}));};
      s.cols.forEach(c=>c.items.forEach(it=>{if(it.node)link(it.node,it.id,'sst-fac-tie');}));
      s.belts.forEach(b=>{link(b.from,b.to,'sst-fac-belt'+(b.fresh?' is-new':''));
        const last=lines.lastChild;if(last&&last.getAttribute('class').indexOf('belt')>=0)last.setAttribute('marker-end','url(#'+(b.fresh?'sst-fac-ahn':'sst-fac-ah')+')');});
      svg.append(lines);
      s.cols.forEach(c=>c.items.forEach(it=>{
        const p=pos[it.id];const g=sv('g',{'class':'sst-fac-n sst-fac-'+c.key+(it.fresh?' is-new':'')});
        g.append(sv('rect',{x:p.x,y:p.y,width:BW,height:BH,rx:7}));
        g.append(sv('text',{x:p.x+10,y:p.y+(it.recipe?18:27),'class':'sst-fac-l'},it.label));
        if(it.recipe)g.append(sv('text',{x:p.x+10,y:p.y+35,'class':'sst-fac-r'},'makes '+it.recipe));
        svg.append(g);
      }));
      const words='After reply '+(ti+1)+': '+s.machines+(s.machines===1?' building':' buildings')+', '+s.belts.length+(s.belts.length===1?' belt':' belts')
        +', '+s.power.burner+(s.power.burner===1?' burner':' burners')+' and '+s.power.pole+(s.power.pole===1?' power pole':' power poles')+'.'
        +(s.added||s.removed?' This reply: '+[s.added?s.added+' built':'',s.removed?s.removed+' taken down':''].filter(Boolean).join(', ')+'.':'');
      svg.setAttribute('aria-label',words);
      fac.fsum.textContent=words;
      fac.fbox.replaceChildren(svg);
    }

    const chapterBs=[];
    if(v.chapters.main.length||v.chapters.wrong.length){
      const ch=el('section','sst-chapters');
      ch.append(el('h2',null,'Jump to a moment'));
      const grid=el('div','lst-chapters');
      v.chapters.main.forEach((c,i)=>{
        const b=btn('lst-chapter',null,'ch'+i);
        b.append(el('span','lst-chapter-n',c.where),el('span','lst-chapter-t',c.label));
        b.addEventListener('click',()=>{go(c.index,'ch'+i);});
        grid.append(b);chapterBs.push([b,c.index,'lst-chapter']);
      });
      ch.append(grid);
      if(v.chapters.wrong.length){
        const d=toggle('wrong','sst-wrong','Every move that went wrong ('+v.chapters.wrong.length+')');
        const ol=el('ol','sst-wrong-list');
        v.chapters.wrong.forEach((c,i)=>{
          const li=el('li');
          const b=btn('sst-wrong-b',null,'wr'+i);
          b.append(el('span','lst-chapter-n',c.where),el('span',null,c.label));
          if(c.said)b.append(el('span','sst-code-inline',c.said));
          b.addEventListener('click',()=>{go(c.index,'wr'+i);});
          li.append(b);ol.append(li);chapterBs.push([b,c.index,'sst-wrong-b']);
        });
        d.append(ol);ch.append(d);
      }
      root.append(ch);
    }

    const card=el('section','sst-card');card.setAttribute('aria-labelledby','sst-card-h');
    const cardH=el('h2');cardH.id='sst-card-h';cardH.tabIndex=-1;cardH.dataset.fk='card-h';   // where focus goes if its toggle is gone
    const cardBody=el('div','sst-card-body');
    card.append(cardH,cardBody);root.append(card);

    if(v.codes.length){
      const cs=el('section','sst-codetable');
      cs.append(el('h2',null,'What the codes mean, and who said them'));
      const tb=el('table');
      const capText=('Each code in this run’s record, exactly as recorded, with who said it: “game said” for the game’s own reason names and the game add-on’s codes, “this test’s rule” for codes from this test’s own rules (such as its bank), and “the run’s record” where neither is found in this repo. A plain meaning is given only where the game add-on’s code, the game’s reason name or the run’s hint backs it.');
      const cap=el('caption',null,'Codes in this run’s record, exactly as recorded');
      const capMore=toggle('codeslabel','sst-more','How each code is labelled');capMore.append(el('p',null,capText));cs.append(capMore);
      const thead=el('thead');const hr=el('tr');
      for(const h of ['Code','Who said it','What it means','Times'])hr.append(el('th',null,h));
      thead.append(hr);
      const tbody=el('tbody');
      for(const c of v.codes){
        const tr=el('tr');tr.dataset.by=c.by;
        const td0=el('td');td0.append(el('code',null,c.code));
        const td1=el('td');td1.append(el('strong',null,c.label));
        if(c.origin)td1.append(el('span','sst-origin',c.origin));
        const td2=el('td',null,c.why||'(no plain meaning: only the code is shown)');
        if(c.why&&(c.source||c.hint)){
          const d=toggle('src:'+c.code,'sst-src','Where this meaning comes from');
          if(c.source)d.append(el('p',null,c.source));
          if(c.hint&&!(c.source||'').includes(c.hint))d.append(el('p',null,BY.hint+': “'+c.hint+'”'));
          td2.append(d);
        }
        tr.append(td0,td1,td2,el('td',null,String(c.count)));
        tbody.append(tr);
      }
      tb.append(cap,thead,tbody);cs.append(tb);root.append(cs);
    }

    const logS=el('section','lst-events');
    const det=toggle('log',null,'Every reply, in order');
    const lab=el('label','sst-filter');
    const cb=el('input');cb.type='checkbox';cb.checked=st.onlyWrong;cb.dataset.fk='filter';
    cb.addEventListener('change',()=>{st.onlyWrong=cb.checked;draw();});
    lab.append(cb,el('span',null,'Show only what went wrong'));
    const logCount=el('p','lst-note');
    const logOl=el('ol');
    det.append(lab,logCount,logOl);logS.append(det);root.append(logS);
    if(v.source||story.site){
      const f=el('footer','lst-foot');
      if(story.site&&typeof story.site.back==='string'&&/^[\w./#-]+$/.test(story.site.back)){
        const a=el('a',null,story.site.backText||'Back');a.href=story.site.back;const pa=el('p');pa.append(a);f.append(pa);
      }
      if(v.source)f.append(el('p',null,v.source));
      if(story.site&&story.site.notice)f.append(el('p',null,story.site.notice));
      root.append(f);
    }

    function drawCard(){
      cardH.textContent='Reply '+(v.moment.index+1);
      const parts=[];
      if(v.card.note){
        const q=el('blockquote','sst-note');
        q.append(el('span','sst-note-by','The AI’s note'),el('span',null,v.card.note));
        parts.push(q);
      }
      if(v.card.lost&&!v.card.steps.length)parts.push(el('p','sst-lost',v.card.lost));
      if(v.card.steps.length){
        const list=el('ol','sst-steps');
        v.card.steps.forEach((s,si)=>{
          const li=el('li','lst-card tone-'+s.tone);
          const h3=el('h3');h3.append(el('span','sst-step-tag',s.mark+' '+s.tag),document.createTextNode(' '+s.text));
          li.append(h3,el('p','lst-state',s.answer));
          if(s.said&&s.said.length){
            const ul=el('ul','sst-said');
            for(const x of s.said){const i=el('li');i.dataset.by=x.by;i.append(el('span','sst-by',x.label+': '),document.createTextNode(x.text));ul.append(i);}
            li.append(ul);
          }
          if(s.codes&&s.codes.length){
            const cl=el('ul','sst-codes');
            for(const c of s.codes){
              const ci=el('li');ci.dataset.by=c.by;ci.append(el('code',null,c.label.toLowerCase()+': '+c.code));
              if(c.why)ci.append(document.createTextNode(': '+c.why));
              cl.append(ci);
            }
            li.append(cl);
          }
          if(s.raw&&s.raw.length){
            const d=toggle('raw:'+si,'sst-raw','Exact fields in the run’s record');
            const ul=el('ul');
            for(const r of s.raw){const i=el('li');i.dataset.by=r.by;i.append(el('span','sst-by',r.label+': '),el('code',null,r.text));ul.append(i);}
            d.append(ul);li.append(d);
          }
          list.append(li);
        });
        parts.push(list);
      }
      if(v.card.notRun)parts.push(el('p','lst-gap',v.card.notRun));
      cardBody.replaceChildren(...parts);
    }
    function drawLog(){
      logCount.textContent=v.logCount;
      logOl.replaceChildren(...v.log.map(r=>{
        const li=el('li',r.current?'is-past':'is-future');
        const b=btn(null,r.mark+' '+r.text,'log'+r.index);
        if(r.current)b.setAttribute('aria-current','step');
        b.addEventListener('click',()=>{go(r.index,'log'+r.index);});
        li.append(b);return li;
      }));
    }

    function draw(){
      const ae=document.activeElement;
      const had=ae&&root.contains(ae)&&ae.dataset?ae.dataset.fk:null;
      const want=st.focus||had;st.focus=null;
      const inCard=!!(ae&&cardBody.contains(ae));
      v=view(story,st);
      if(mara)v.marathon.bought.forEach((b,i)=>{
        mara.pins[i].classList.toggle('is-reached',b.reached);
        mara.btns[i].classList.toggle('is-reached',b.reached);mara.btns[i].classList.toggle('is-current',b.current);
        mara.btns[i].setAttribute('aria-pressed',String(b.current));});
      if(hero){
        hero.hh.textContent=v.hero.headline;
        hero.atP.textContent=v.hero.at+':';
        v.hero.items.forEach((it,i)=>{
          const r=hero.rows[i];
          r.li.className='sst-goal'+(it.done?' is-done':'');
          r.name.textContent=it.name;r.num.textContent=it.machine+' / '+it.need;
          r.bar.setAttribute('aria-label',it.label);r.m.style.width=it.width.machine+'%';
          r.text.textContent=it.text;r.text.hidden=it.done; // a full bar says it; the words stay in the bar's label
          r.bench.hidden=!it.bench;r.btext.hidden=!it.bench;
          r.bench.setAttribute('aria-label',it.benchText||'');r.bs.style.width=it.width.bench+'%';
          r.btext.textContent=it.benchText||'';
        });
      }
      playB.textContent=st.timer?'Pause':'Play';
      drawFactory(v.moment.index);
      range.value=String(v.moment.index);range.setAttribute('aria-valuetext',v.moment.text);
      v.strip.forEach((d,i)=>{
        const dot=dots[i];
        dot.className='sst-dot tone-'+d.tone+(d.current?' is-current':'');
        dot.tabIndex=d.current?0:-1;
        if(d.current)dot.setAttribute('aria-current','step');else dot.removeAttribute('aria-current');
      });
      moment.textContent=v.moment.text;
      live.textContent=v.live;
      for(const [b,idx,cls] of chapterBs){
        const cur=idx===v.moment.index;
        b.className=cls+(cur?' is-current':'');
        if(cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
      }
      drawCard();drawLog();
      const now=document.activeElement;
      if(want&&(!now||now===document.body||!root.contains(now)||now.dataset.fk!==want)){
        const n=root.querySelector(sel(want))||(inCard?cardH:null);
        if(n&&n!==now)n.focus({preventScroll:true});
      }
    }
    draw();
    return {redraw:draw,state:st};
  }

  return {SCHEMA,view,mount,turnTone,factoryAt,MARK,KEY,BY};
});
</script><script>SaveBenchSeatStory.mount(document.getElementById("story"),JSON.parse(document.getElementById("story-data").textContent));</script><script>(function(){var f=document.getElementById("run-film"),h=document.querySelector("#story .lst-head");if(f&&h){h.after(f.querySelector("figure"));f.remove();}})();</script><script src="../../../assets/savebench/film/film.js" defer></script></body></html>
